name: Pabrikasi ZF Data Node APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Kompilasi APK Mesin Linux
    runs-on: ubuntu-latest

    steps:
      - name: Ekstraksi Kode Inti
        uses: actions/checkout@v4

      - name: Instalasi Mesin Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Instalasi Mesin Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.0'
          channel: 'stable'

      - name: Otomatisasi Scaffolding Kerangka Android
        run: flutter create --project-name zf_data_node --org com.masion --platforms android .
  
      - name: Injeksi Master Protocol & Kalibrasi SDK 34
        run: |
          python -c "
          import os
          # 1. Injeksi Gerbang Intent OS Android
          path_manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(path_manifest, 'r') as f: data = f.read()
          intent = '''
              <intent-filter>
                  <action android:name=\"android.intent.action.SEND\" />
                  <category android:name=\"android.intent.category.DEFAULT\" />
                  <data android:mimeType=\"text/plain\" />
              </intent-filter>
          '''
          data = data.replace('</activity>', f'{intent}</activity>')
          with open(path_manifest, 'w') as f: f.write(data)

          # 2. Kalibrasi Paksa Android SDK ke Versi 34
          path_gradle = 'android/app/build.gradle'
          with open(path_gradle, 'r') as f: gradle_data = f.read()
          gradle_data = gradle_data.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 34')
          gradle_data = gradle_data.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 34')
          with open(path_gradle, 'w') as f: f.write(gradle_data)
          "


      - name: Unduh Pustaka
        run: flutter pub get

      - name: Eksekusi Kompilasi Rilis Absolut
        run: flutter build apk --release --no-tree-shake-icons

      - name: Ekstraksi Artefak APK
        uses: actions/upload-artifact@v4
        with:
          name: ZF-Data-Node-Release
          path: build/app/outputs/flutter-apk/app-release.apk
